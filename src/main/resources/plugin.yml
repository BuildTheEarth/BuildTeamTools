name: BuildTeamTools
main: net.buildtheearth.buildteamtools.BuildTeamTools
api-version: 1.20.6
version: ${version}
description: ${description}
author: MineFact, frikandelworst, George112n, ELgamer, SirJodelstein, Zoriot
softdepend: [ WorldEdit, HeadDatabase, PlotSystem-Terra, BlueMap ]

permissions:
  btt.permpack.visitor:
    description: Contains all permissions for visitors / everyone
    default: op
    children:
      btt.navigator.use: true
      btt.warp.use: true
      btt.warp.random: true
      btt.address.get: true
      btt.address.teleport: true
      btt.bp.use: true
      btt.global.autotpll: true
  btt.permpack.builder:
    description: Contains all permissions for builders / trusted players
    default: op
    children:
      btt.generator.use: true
      btt.generator.rail.use: true
      btt.generator.rail.menu: true
      btt.generator.rail.multiple: true
  btt.permpack.admin:
    description: Contains all permissions for admins
    default: op
    children:
      btt.command.use: true
      btt.command.cache: true
      btt.command.checkForUpdates: true
      btt.command.communicators: true
      btt.command.debug: true
      btt.command.reload: true
      btt.command.update: true
      btt.warp.create: true
      btt.warp.edit: true
      btt.warp.delete: true
      btt.warp.group.create: true
      btt.warp.group.edit: true
      btt.warp.group.delete: true
      btt.notify.update: true
      btt.bp.edit: true
      btt.generator.rail.create: true
      btt.generator.rail.edit: true
      btt.generator.rail.delete: true

  btt.generator.rail.use:
    description: Allows players to use the rail generator
    default: op
  btt.generator.rail.menu:
    description: Allows players to open the rail type menu
    default: op
  btt.generator.rail.create:
    description: Allows players to create custom rail types
    default: op
  btt.generator.rail.edit:
    description: Allows players to edit custom rail types
    default: op
  btt.generator.rail.delete:
    description: Allows players to delete custom rail types
    default: op
  btt.generator.rail.multiple:
    description: Allows players to generate multiple parallel tracks
    default: op

  btt.bp.use:
    description: Allows players to use /blockpalette
    default: op
  btt.bp.edit:
    description: Allows players to create and edit custom block palettes
    default: op

github-repo: "BuildTheEarth/BuildTeamTools"
