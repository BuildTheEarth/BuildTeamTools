# BuildTeamTools translations (en_US)
# MiniMessage format. Arguments: <arg:0>, <arg:1>, … or named tags via Argument.
# Prefix: insert the config message-prefix with <prefix> (see config.yml).
# Prefer stable btt.* keys.
#
# An editable copy is written to plugins/BuildTeamTools/lang/ on first enable.
# Plugin updates append missing keys there; existing edits are kept.
# Extra locales: drop messages_<lang>_<COUNTRY>.properties into that folder (e.g. messages_de_DE.properties).
# /btt reload-config re-reads the lang folder.

