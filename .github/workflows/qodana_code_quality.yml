name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: # Specify your branches here
      - main # The 'main' branch
      - 'releases/*' # The release branches

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # a full history is required for pull request analysis

      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.1
        with:
          args: '--linter qodana-jvm-community --fail-threshold 0'
          pr-mode: ${{ github.event_name == 'pull_request' }}

          # GitHub doesn't allow comments/check annotations from fork PRs.
          post-pr-comment: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          use-annotations: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

          # Keep the full report available in the workflow run.
          upload-result: true
        env:
          QODANA_TOKEN: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.QODANA_TOKEN_538010437 || '' }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
